name: Deploy Worship Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Write runtime config
        env:
          CONFIG_JS: ${{ vars.WORSHIP_WIKI_CONFIG_JS }}
        run: |
          if [ -n "$CONFIG_JS" ]; then
            printf '%s\n' "$CONFIG_JS" > dist/config.js
            echo "config.js written from repository variable"
          else
            echo "WORSHIP_WIKI_CONFIG_JS not set; site deploys in local-draft mode"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
